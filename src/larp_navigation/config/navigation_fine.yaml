# Fine-grid full-course search measured ~188 ms on the build host; cached thereafter.
global_route:
  search_budget_ms: 250.0
# Conservative development configuration; flight qualification pending.
navigation_safety:
  # Travel heading only: skip camera-view raycasting entirely.
  prefer_observable_heading: false
  # SUPER uses soft penalties. Optimize below these independent hard bounds.
  max_velocity: 0.2
  max_acceleration: 0.3
  max_yaw_rate: 0.35
  max_yaw_acceleration: 0.5
  validation_budget_ms: 10.0
fsm:
  click_goal_en: true
  click_goal_topic: /goal_pose
  click_height: 1.5
  click_yaw_en: true
  replan_rate: 15.0
  cmd_topic: /planning/pos_cmd
  mpc_cmd_topic: /planning_cmd/poly_traj
  timer_en: true
super_planner:
  backup_traj_en: true
  detailed_log_en: false
  visualization_en: false
  use_fov_cut: false
  print_log: false
  visual_process: false
  frontend_in_known_free: true
  # Keep travel heading through arrival instead of forcing the mission goal yaw.
  goal_yaw_en: false
  goal_vel_en: false
  corridor_bound_dis: 1.0
  corridor_line_max_length: 1.2
  safe_corridor_line_max_length: 5.0
  iris_iter_num: 2
  obs_skip_num: 2
  replan_forward_dt: 0.1
  # At 0.06 m/s, a 1 m guide stays within the 30 s polynomial certificate bound.
  planning_horizon: 1.0
  sensing_horizon: -1
  receding_dis: 1.0
  robot_r: 0.35
  yaw_dot_max: 0.3
  yaw_ddot_max: 0.4
  yaw_mode: 1
  mpc_horizon: 15
traj_opt:
  switch:
    save_log_en: false
    print_optimizer_log: false
  boundary:
    # Soft targets below independently certified 0.2 m/s and 0.3 m/s^2 limits.
    # Time weight reduced so optimization does not routinely trade away
    # these slow-motion targets. Run046 turn lag reached 0.17 m at 0.12 m/s.
    # Doubling trajectory time scales velocity by 1/2 and acceleration by 1/4;
    # qualify tracking at this bandwidth before raising speed.
    max_vel: 0.06
    max_acc: 0.04
    max_jerk: 8.0
    max_omg: 1.0
    max_acc_thr: 20.0
    min_acc_thr: 6.0
    penna_margin: 0.05
  exp_traj:
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-06
    scale_factor: 1.0
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 120.0
    penna_pos: 5000000.0
    penna_vel: 500000.0
    penna_acc: 500000.0
    penna_jerk: -500000.0
    penna_attract: 1000.0
    penna_omg: 500000.0
    penna_thr: 100000.0
  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: true
    opt_accuracy: 1.0e-06
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 120.0
    penna_ts: 100000.0
    penna_pos: 1000000.0
    penna_vel: 100000.0
    penna_acc: 5000000.0
    penna_jerk: -100000.0
    penna_omg: 100000.0
    penna_max_acc_thr: 100000.0
    penna_min_acc_thr: 100000.0
  flatness:
    mass: 1.25
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81
astar:
  map_voxel_num:
  - 160
  - 160
  - 80
  visual_process: false
  allow_diag: true
  heu_type: 2
  debug_visualization_en: false
rog_map:
  resolution: 0.05
  inflation_resolution: 0.05
  inflation_step: 8
  unk_inflation_en: true
  unk_inflation_step: 8
  map_size:
  - 12
  - 12
  - 5
  fix_map_origin:
  - 0
  - 0
  - 1.5
  frontier_extraction_en: false
  # Broad storage bounds, not flight permission. The measured floor must be
  # fused while the camera is on the launch pad, before aircraft clearance exists.
  virtual_ceil_height: 10.0
  virtual_ground_height: -10.0
  load_pcd_en: false
  map_sliding:
    enable: true
    threshold: 0.3
  esdf:
    enable: false
    resolution: 0.05
    local_update_box:
    - 5
    - 5
    - 3
  ros_callback:
    enable: false
    cloud_topic: /cloud_registered
    odom_topic: /lidar_slam/odom
    odom_timeout: 2.0
  visualization:
    enable: false
    use_dynamic_reconfigure: false
    time_rate: 2
    frame_rate: 0
    range:
    - 15
    - 15
    - 4
    frame_id: map
    pub_unknown_map_en: false
  intensity_thresh: -10
  point_filt_num: 1
  raycasting:
    enable: true
    batch_update_size: 1
    # Correlated stereo pixels contribute one occupancy update per frame/cell.
    frame_evidence: true
    # Three hit-bearing frames; a ray miss resets pending confirmation.
    occupancy_confirmation_frames: 3
    # Only valid depth rays through a cell count as empty observations.
    clear_confirmation_frames: 3
    local_update_box:
    - 12
    - 12
    - 5
    ray_range:
    - 0.2
    - 6
    p_min: 0.12
    p_miss: 0.45
    p_free: 0.35
    p_occ: 0.75
    p_hit: 0.8
    p_max: 0.98
    unk_thresh: 0.0
