# Larpcopter override of skybeta's oakd_vslam_bringup/config/oakd_vslam.yaml
# (Artash-N/skybeta 0.3.2, Apache-2.0). Installed over the original by the team
# image (jetson/team_image/Dockerfile).
#
# What changes vs skybeta, and why:
#   * i_pipeline_type stereo -> depth: the OAK's on-device StereoDepth engine runs
#     and publishes a depth image. No Jetson compute.
#   * The left/right RAW sockets are no longer sent to the host. skybeta sent them
#     as bgr8 (3 bytes/px for a mono sensor): 118 MB/s of the ~143 MB/s USB/XLink
#     ceiling, which left no room for depth. Instead StereoDepth's RECTIFIED
#     left/right outputs are published (mono8, 1 byte/px) and cuVSLAM reads those
#     (rectified_images: true in our oakd_vslam.launch.py).
#   * Budget at 1024x640 @ 30: rect L+R 2 x 19.7 MB/s + depth (uint16) 39.3 MB/s
#     = ~79 MB/s, about half of what skybeta's raw pair alone used.
#
# Unchanged: resolution and rate (1024x640 @ 30, what cuVSLAM is tuned for),
# IR off, IMU block verbatim.
/oak:
  ros__parameters:
    driver:
      i_enable_ir: false # S2 has no projector; kept for safety on a Pro

    pipeline_gen:
      i_pipeline_type: depth
      i_enable_imu: true
      i_nn_type: none

    # Mono sensors feed StereoDepth on the device; their raw bgr8 frames are not
    # sent to the host any more.
    left:
      i_publish_topic: false
      i_width: 1024
      i_height: 640
      i_fps: 30.0

    right:
      i_publish_topic: false
      i_width: 1024
      i_height: 640
      i_fps: 30.0

    stereo:
      i_enable_lazy_publisher: false # cuVSLAM subscribes late; publish from t=0
      # Rectified mono8 pair for cuVSLAM: /oak/left_rect/image_rect, /oak/right_rect/image_rect
      i_left_rect_publish_topic: true
      i_right_rect_publish_topic: true
      # Depth: /oak/stereo/image_raw (uint16, mm) + /oak/stereo/camera_info
      i_depth_preset: DEFAULT
      i_lr_check: true # drop pixels where left->right and right->left disagree
      i_subpixel: false
      i_extended_disp: false
      i_aligned: false # depth stays in the rectified stereo frame

    imu:
      # Verbatim from skybeta (measured there: 199.5 Hz with these settings).
      i_acc_freq: 200
      i_gyro_freq: 200
      i_message_type: IMU
      i_sync_method: LINEAR_INTERPOLATE_ACCEL
      i_batch_report_threshold: 1
      i_max_batch_reports: 10
      i_enable_rotation: false
      i_enable_mag: false
